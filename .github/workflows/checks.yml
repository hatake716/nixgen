# The checks CLAUDE.md asks for before shipping, run on every push.
#
# They existed as two good harnesses that only ran when somebody remembered,
# which is how the screenshots went three features out of date. Same fix as
# there: make it happen without being remembered.
#
# Everything runs through `nix develop`, so what CI uses and what the checklist
# tells a person to type are the same commands in the same environment.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

# The harnesses need a real option index. Which channel hardly matters — they
# read whatever catalogue they are given — so this is the current stable one.
env:
  CHANNEL: nixos-26.05

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Sources parse
        run: |
          nix develop --command python3 -c 'import ast, glob; [ast.parse(open(f).read()) for f in glob.glob("build/*.py") + glob.glob("tools/*.py")]'
          nix develop --command node --check build/static/app.js
          bash -n build/fetch-data.sh

      - name: The flake builds
        run: nix build . --no-link --print-out-paths

      # Building an index takes a few minutes, so it is kept for a week rather
      # than rebuilt on every push. No restore-key on purpose: a fallback would
      # mean the index never refreshed, and a stale catalogue is the one thing
      # these harnesses cannot notice.
      - name: Week
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cached index
        id: cache
        uses: actions/cache@v6
        with:
          path: data
          key: index-${{ env.CHANNEL }}-${{ steps.week.outputs.stamp }}

      - name: Build the index
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix develop --command bash build/fetch-data.sh "$CHANNEL"
          nix develop --command python3 build/build_index.py --channel "$CHANNEL"
          # The raw dumps are ~390 MB and the index does not need them again.
          rm -f data/options.json data/packages.json

      - name: Renderer — fixed regressions, then random sampling
        run: nix develop --command python3 tools/fuzz.py

      - name: Importer — fixed configurations, through both readers
        run: nix develop --command python3 tools/import_check.py

  # The eleven-point browser sweep, against the real app in a real browser.
  # It lived in session scratchpads and was rebuilt by hand for every
  # verification pass; now it is tools/browser_check.py and runs here, so a
  # UI change that breaks the import path or the mobile nav fails the push
  # that made it. `needs: checks` so the week's index cache is already warm.
  #
  # What CI still does not run is tools/eval_check.py — evaluating the
  # generated bundle as a NixOS system fetches a pinned nixpkgs and takes
  # minutes. Run that one before a release.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Week
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cached index
        id: cache
        uses: actions/cache@v6
        with:
          path: data
          key: index-${{ env.CHANNEL }}-${{ steps.week.outputs.stamp }}

      - name: Build the index
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix develop --command bash build/fetch-data.sh "$CHANNEL"
          nix develop --command python3 build/build_index.py --channel "$CHANNEL"
          rm -f data/options.json data/packages.json

      - name: The eleven points, in a real browser
        run: |
          nix develop --command python3 build/server.py \
            --db data/nixgen.sqlite --port 8824 --no-browser &
          for i in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8824/ && break
            sleep 1
          done
          # Browsers and the driver from the same nixpkgs, so their versions
          # match — a mismatched pair downloads browsers at runtime instead.
          BROWSERS=$(nix build --impure --expr \
            '(import (builtins.getFlake "nixpkgs") { }).playwright-driver.browsers' \
            --no-link --print-out-paths)
          PYENV=$(nix build --impure --expr \
            'with import (builtins.getFlake "nixpkgs") { }; python3.withPackages (ps: [ ps.playwright ])' \
            --no-link --print-out-paths)
          PLAYWRIGHT_BROWSERS_PATH=$BROWSERS \
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            "$PYENV/bin/python3" tools/browser_check.py http://127.0.0.1:8824/
          # Every name the presets promise, against the channel that is
          # indexed. Cheap — one page load and a handful of batched queries —
          # and it is the check that turns a NixOS release from a discovery
          # into a checklist item: run it on the new channel and it names
          # what nixpkgs renamed underneath us.
          PLAYWRIGHT_BROWSERS_PATH=$BROWSERS \
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            "$PYENV/bin/python3" tools/catalogue_check.py http://127.0.0.1:8824/
